<!DOCTYPE html>
<html>
<head>
    <title>Bus Pass Application Managemnet</title>

    <style>
        body {
            font-family: Arial;
            background: white;
        }
        form {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: rgb(144, 230, 230);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<form action="/buspass" method="POST">

    <h2>Bus Pass Application</h2>

    <label>Student Name</label>
    <input type="text"
           name="studentName"
           pattern="[A-Za-z ]+"
           title="Student Name should contain only alphabets"
           required>

    <label>Register Number</label>
    <input type="text"
           name="registerNumber"
           required>

    <label>Bus Route</label>
    <input type="text"
           name="busRoute"
           required>

    <label>Mobile Number</label>
    <input type="text"
           name="mobileNumber"
           pattern="[0-9]{10}"
           maxlength="10"
           title="Mobile Number must contain exactly 10 digits"
           required>

    <button type="submit">Submit</button>

</form>

</body>
</html>
